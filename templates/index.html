<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <style>
        body {
            /*
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            */
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Georgia', serif;
            background-color: #f9f9f9;
            color: #333;
            overflow-x: hidden;
            margin: 0;
            padding: 20px;
        }

        header {
        padding: 10px 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #201e1ea6;
        border-bottom: 3px solid #4e637b5d;
        background-color: #ffffff;
        }

        .logo {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
        }

        nav a {
        margin-left: 20px;
        font-size: 14px;
        text-decoration: none;
        color: #555555;
        font-weight: 500;
        }

        .hero {
        width: 100vw;
        max-width: 100%;
        height: auto;
        padding: 20px 10px;
        background-color: RGB(55, 98, 102);
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-sizing: border-box;
        color: white;
        text-align: center;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
        margin: 0;
        }

        .hero h1 {
        font-size: 28px;
        text-align: center;
        margin: 0;
        }
        
        #rodape {
        width: 100vw;
        max-width: 100%;
        text-align: center;
        padding: 20px 10px;
        background-color: RGB(55, 98, 102);
        /*position: relative;
        bottom: 0;
        width: 100%;*/
        color: white;
        font-size: 14px;
        box-sizing: border-box;
        /*margin-bottom: 10px;*/
        }
        
        #hist {
            margin-bottom: 20px;
            color: #fff;
        }
        
        #direitos {
            margin-bottom: 20px;
            color: #fff;
            font-size: 17px;
        }

        
        /*h1 {
            color: rgb(94, 143, 178);
            text-align: center;
            margin: 10px 0;
        }*/

        form {
            flex-direction: column;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            max-width: 400px;
            width: 100%;
            gap: 10px;
        }

                input[type="file"] {
        display: none;
        }

        .custom-file-upload,
        button {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        /*text-align: center;*/
         }

        .custom-file-upload {
        background-color: #5e8fb2;
        color: white;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        display: inline-block;
        margin-right: 10px;
        transition: background-color 0.3s;
        text-align: center;
        }

        .custom-file-upload:hover {
        background-color: #48738e;
        }


        /*
        input[type="file"], button {
            padding: 10px;
            font-size: 16px;
        }
        */

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .gallery a,
        .gallery video {
            display: block;
            width: 100px;
            max-width: 90%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            object-fit: cover;
            overflow: hidden;
            }       

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            }

        /*
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            object-fit: cover;
        }

        */

        @media (max-width: 500px) {
            input[type="file"], button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    
    <header>
        <div class="logo"> <img src="logo0.jpg" alt="logo" id="logo" width="80" height="80" > </div>
        <div><h1></h1></div>
        <nav>
          <a href="#gallery">Galeria</a>
          <a href="https://wa.me/5547997010548" target="_blank">Contato</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Gabrielli e Tiago</h1>
        <h2>26/04/2025</h2>

    </div>


    <form method="POST" enctype="multipart/form-data">
        <label for="file-upload" class="custom-file-upload">
            Escolher Foto
        </label>
        <input id="file-upload" type="file" name="file" accept="image/*,video/*" capture="environment" required>

        <!--<input id="file-upload" type="file" name="file" required> teste-->

        <button type="submit">Enviar Foto</button>
      </form>
      
    <!--
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Enviar Foto</button>
    </form>
    
    <div class="gallery">
        {% for photo in photos %}
            <img src="{{ url_for('static', filename='uploads/' ~ photo) }}" alt="Foto enviada">
        {% endfor %}
    </div>
    -->

        <div class="gallery">
        {% for photo in photos %}
            <a href="{{ url_for('static', filename='uploads/' ~ photo) }}" target="_blank">
            <img src="{{ url_for('static', filename='uploads/' ~ photo) }}" alt="Foto enviada">
            </a>
        {% endfor %}
        </div>

        <footer id="rodape">
            <h1 id="hist">Vivendo juntos com muito amor, fé, felicidade e união!</h1>
            <h1 id="direitos"> &copy; 2025 Gabrielli e Tiago. Todos os direitos reservados.</h1>
</body>
</html>
